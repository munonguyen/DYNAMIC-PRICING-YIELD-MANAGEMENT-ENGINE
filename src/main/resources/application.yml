spring:
  application:
    name: yield-pricing-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/yield_engine}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: YieldEngineHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: "SET lock_timeout = '2s'; SET statement_timeout = '5s'; SET idle_in_transaction_session_timeout = '10s';"

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      timeout: 2000ms

elasticsearch:
  enabled: ${ELASTICSEARCH_ENABLED:true}
  uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  connect-timeout-ms: 1500
  read-timeout-ms: 3500
  sync-interval-ms: 30000
  bookings-index: arenapulse_bookings_analytics
  courts-index: arenapulse_court_search

  threads:
    virtual:
      enabled: false # Set to true when running on Java 21+

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

storage:
  media:
    base-dir: ${MEDIA_STORAGE_DIR:./data/uploads/courts}
    max-files-per-group: 12
  kyc:
    base-dir: ${KYC_STORAGE_DIR:./data/uploads/kyc}

momo:
  gateway:
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    partner-code: ${MOMO_PARTNER_CODE:}
    access-key: ${MOMO_ACCESS_KEY:}
    secret-key: ${MOMO_SECRET_KEY:}
    redirect-url: ${MOMO_REDIRECT_URL:http://127.0.0.1:5174/checkout}
    ipn-url: ${MOMO_IPN_URL:}
    live-http-enabled: ${MOMO_LIVE_HTTP_ENABLED:true}

vnpay:
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  version: ${VNPAY_VERSION:2.1.0}
  command-pay: ${VNPAY_COMMAND_PAY:pay}
  curr-code: ${VNPAY_CURR_CODE:VND}
  default-order-type: ${VNPAY_ORDER_TYPE:other}
  default-locale: ${VNPAY_LOCALE:vn}
  return-url: ${VNPAY_RETURN_URL:http://127.0.0.1:5174/checkout}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

pricing:
  token:
    secret-key: ${PRICING_TOKEN_SECRET:YieldEngineDeterministicSecretKeyHMACSHA256SecretValueMustBe256BitsMinimum!}
    qr-secret-key: ${QR_TOKEN_SECRET:YieldEngineQrCheckInDistinctSecretKeyHMACSHA256MustBe256BitsMinimum!}
    ttl-minutes: 10
  hold:
    ttl-minutes: 10
    sweep-ms: 15000
  outbox:
    poll-ms: 5000
  cache:
    caffeine-spec: "maximumSize=10000,expireAfterWrite=60s"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.yieldengine: INFO
    org.hibernate.SQL: WARN
    org.springframework.transaction: INFO
